const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (type="check") => {
 const path = {check:'<path d="m4 8 3 3 6-6"/>',cross:'<path d="m5 5 6 6M11 5l-6 6"/>',higher:'<path d="m8 2 6 11H2L8 2Z"/><path d="M8 6v3m0 2h.01"/>',unknown:'<circle cx="8" cy="8" r="6"/><path d="M6.5 6a1.6 1.6 0 0 1 3 1c-.2 1-1.5 1-1.5 2m0 2h.01"/>',info:'<circle cx="8" cy="8" r="6"/><path d="M8 7v4m0-7h.01"/>'};
 return `<svg class="icon ${type}" viewBox="0 0 16 16" aria-hidden="true">${path[type]||path.info}</svg>`;
};
const fmt = v => esc(v).replace(/\(est\.\)/g,'<span class="est-label">(est.)</span>').replace(/✅/g,icon('check')+'<span class="sr-only">Yes </span>').replace(/❌/g,icon('cross')+'<span class="sr-only">No </span>').replace(/🟡/g,icon('unknown')).replace(/🔴/g,icon('higher'));
const carById = id => DATA.cars.find(c=>c.id===Number(id));

const table = (headers,rows,caption="",cls="",raw=false) => `<div class="table-wrap" tabindex="0" role="region" aria-label="${esc(caption||headers.join(', '))}"><table class="data-table ${cls}"><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>i===0?`<th scope="row">${raw?v:fmt(v)}</th>`:`<td>${raw?v:fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

 $('#comparison-table').innerHTML=`<div class="table-wrap" tabindex="0" role="region" aria-label="Selected car comparison"><table class="data-table compare-table"><thead><tr><th scope="col">What matters</th>${chosen.map(c=>`<th scope="col">${esc(carLabel(c))}<br><span class="est-label">${esc(c.trim)}</span></th>`).join('')}</tr></thead><tbody>${rows.map(r=>{const vals=r.num?chosen.map(r.num):[];const best=r.direction==='min'?Math.min(...vals):Math.max(...vals);return `<tr><th scope="row">${esc(r.label)}</th>${chosen.map(c=>`<td class="${r.num&&r.num(c)===best?'best':''}">${fmt(r.get(c))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`;

function renderSpecs(){return section('specs','03','Range claims, kept in perspective.','A laboratory figure is not the distance to plan between chargers. Read the range basis before comparing.',`${jargon(['MIDC','CCS2','Frunk'])}<div class="reveal">${table(['Car','Published battery','Claimed MIDC','City / highway range','DC 10–80% time','Power','Boot','Ground clearance'],DATA.cars.map(c=>[carLabel(c),c.battery,c.claimed,c.realRange,c.dcTime,c.power,c.boot,c.ground]),'Specifications, range and charging')}</div><p class="table-caption">Figures refer to the recommended trims, including the over-budget VF 7 Earth. “Unavailable” charging entries retain the different charging window quoted in the report.</p>${notes('Why this is uncertain · test basis, conflicts and measurements',DATA.notes.specs,['be-brochure','xuv-spec','xuv-manual','windsor-brochure','tom-page','tom-test','vf-page','vf-test','harrier-brochure','harrier-test','sierra-support','sierra-test','sierra-launch','vf-offer'],`<h4>Independent evidence and estimation basis</h4>${table(['Car','Independent evidence','Method used'],DATA.cars.map(c=>[carLabel(c),c.rangeEvidence,c.rangeMethod]))}<h4>AC, DC and charging support</h4>${table(['Car','AC capability','DC capability','Home-charger treatment','Charging support'],DATA.cars.map(c=>[carLabel(c),c.ac,c.dc,c.homeCharger,c.network]))}<h4>Published conflicts</h4>${table(['Item','Conflicting figures','Report treatment'],DATA.conflicts)}<h4>Cabin dimensions and practicality</h4>${table(['Car','Length × body width × height','Wheelbase','Family practicality'],DATA.cars.map(c=>[carLabel(c),c.dimensions,c.wheelbase,c.practical]))}<h4>Performance for the selected battery</h4>${table(['Car','Layout','Torque','0–100 km/h'],DATA.cars.map(c=>[carLabel(c),c.layout,c.torque,c.acceleration]))}`)}`);}
function warrantyChart(compact=false,width=340){const x=compact?0:148,w=compact?width:420,row=compact?57:48,totalWidth=compact?width:720,height=compact?432:400;return `<svg class="warranty-svg" viewBox="0 0 ${totalWidth} ${height}" role="img" aria-label="${esc(DATA.cars.map(c=>c.short+': '+c.batteryWarranty).join('; '))}"><defs><pattern id="rc-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#10233e"/><rect width="2" height="9" fill="#5ac8fa44"/></pattern></defs>${DATA.cars.map((c,i)=>`<g><title>${esc(c.name+': '+c.batteryWarranty)}</title><text x="0" y="${compact?18+i*row:32+i*row}" fill="#c3d1e8" font-size="12">${esc(carLabel(c))}</text><rect x="${x}" y="${compact?28+i*row:17+i*row}" width="${w}" height="${compact?11:23}" rx="5" fill="#182a46"/><rect x="${x}" y="${compact?28+i*row:17+i*row}" width="${c.warrantyYears?c.warrantyYears/15*w:w}" height="${compact?11:23}" rx="5" fill="${c.warrantyYears?'#5AC8FA':'url(#rc-hatch)'}" opacity="${c.warrantyYears?'.75':'1'}"/><text x="${compact?width:x+w+12}" y="${compact?18+i*row:32+i*row}" text-anchor="${compact?'end':'start'}" fill="${c.warrantyYears?'#5AC8FA':'#b9c7dd'}" font-size="12">${c.warrantyYears?c.warrantyYears+' years':'First RC period'}</text></g>`).join('')}<text x="${compact?0:x}" y="${compact?421:380}" fill="#9FB0CC" font-size="11">${compact?'First private owner · conditions apply':'First private owner · mileage limits and conditions apply'}</text></svg>`;}

function renderWarranty(){return section('warranty','04','Read beyond “lifetime”.','Battery-health thresholds and second-owner coverage matter as much as the headline duration.',`${jargon(['SoH','LFP','ACFC'])}<div class="reveal">${table(['Car','Battery type','First-owner warranty','Guaranteed health','Next owner','Rental option?','Main catch'],DATA.cars.map(c=>[carLabel(c),c.chemistry,c.batteryWarranty,c.health,c.nextOwner,c.rental,c.catch]),'Battery warranty and conditions')}</div><div class="visual-panel reveal"><h3>Warranty length, without stretching the definition.</h3><p>Solid bars use the report’s stated years. Hatched bars show a first-registration-period promise; a fixed duration was not verified.</p><div id="warranty-chart">${warrantyChart()}</div></div><div class="callout reveal">${icon('info')}<p><strong>For the assumed eight-year ownership, buy the battery outright.</strong><br>Rental is separate from charging. Minimum billing, finance fees and exit conditions can raise the total.</p></div>${notes('Warranty fine print, vehicle cover and battery-rental costs',DATA.notes.warranty,['be-warranty','be-faq','xuv-spec','windsor-warranty','tom-warranty','vf-warranty','tata-warranty'],`<h4>Vehicle, motor and service coverage</h4>${table(['Car','Vehicle warranty','Motor warranty','Free care / RSA','Extended warranty'],DATA.cars.map(c=>[carLabel(c),c.vehicleWarranty,c.motorWarranty,c.freeCare,c.extended]))}<h4>Battery rental in the report’s ownership scenario</h4>${table(['Programme','Structure','Battery charge','Five-year rental','Eight-year rental','Assessment'],DATA.rentalRows)}`)}`,true);}
function renderSafety(){const rows=DATA.cars.map(c=>[esc(carLabel(c)),`<span class="safety-cell">${starIcons(c)}<span>${esc(c.crash)}</span></span>`,esc(c.airbags),fmt(c.adas),esc(c.safetyOther)]);return section('safety','05','Evidence before reassurance.','Crash-test results are independent evidence. Equipment lists and battery-abuse tests answer different questions.',`${jargon(['ADAS','IP67'])}<div class="reveal">${table(['Car','Crash-test evidence','Airbags · selected trim','ADAS · selected trim','Other safety evidence'],rows,'Safety comparison','',true)}</div><div class="callout warning reveal">${icon('higher')}<p><strong>No EV-specific crash result was verified for XUV 3XO Electric, Windsor EV, Hector Tomahawk EV or Sierra EV.</strong><br>Do not transfer the combustion XUV 3XO or Sierra’s crash rating to their electric versions.</p></div>${notes('Crash-rating applicability and supervision',DATA.notes.safety.concat(DATA.cars.map(c=>c.name+': '+c.crashNote)),['be-ncap','vf-ncap','harrier-ncap','xuv-ncap','tom-page','sierra-page'])}`);}

function renderCosts(){return section('costs','07','The price of living with it.','Fixed five- and eight-year scenarios from the report. Toggle the period; no new costs are calculated.',`<div class="two-col"><div class="visual-panel reveal"><div class="cost-header"><div><h3 id="cost-title">8-year cash cost</h3><p class="tiny">Purchase + electricity + ownership reserve</p></div><div class="segmented" role="group" aria-label="Ownership period"><button data-years="5" aria-pressed="false">5 years</button><button data-years="8" aria-pressed="true">8 years</button></div></div><div id="cost-chart"></div><p class="table-caption">Every label is the report’s fixed total, including “(est.)”. Bars indicate magnitude only. Resale proceeds and finance interest are excluded.</p></div><div><div class="cost-list">${DATA.cars.map(c=>`<article class="cost-tile reveal"><h4>${esc(carLabel(c))}</h4><div class="cost-tile-values"><div><small>Home charging</small><strong>${fmt(c.homeCost)}</strong></div><div><small>Public fast charging</small><strong>${fmt(c.publicCost)}</strong></div></div></article>`).join('')}</div></div></div>${notes('Cost assumptions, efficiency and local ownership support',DATA.notes.costs,['oerc','public-tariff','vf-offer','utkal','mg-service','vf-local','tata-local'],`<h4>Cost model</h4>${table(['Assumption','Value used'],DATA.costModel)}<h4>Full running-cost and ownership table</h4>${table(['Car','Consumption','Home cost/km','Public cost/km','Five-year cash cost','Eight-year cash cost','Resale outlook'],DATA.cars.map(c=>[carLabel(c),c.efficiency,c.homeCost,c.publicCost,c.cost5,c.cost8,c.resale]))}<h4>Bhubaneswar and regional after-sales support</h4>${table(['Car','Support located','Parts and after-sales assessment'],DATA.cars.map(c=>[carLabel(c),c.service,c.parts]))}`)}`);}
function updateCosts(){const field=currentCostYears===5?'cost5':'cost8',num=field+'Value',host=$('#cost-chart');const max=Math.max(...DATA.cars.map(c=>c[num]));const width=Math.max(280,Math.round(host.clientWidth)),row=57;$('#cost-title').textContent=currentCostYears+'-year cash cost';host.innerHTML=`<svg class="cost-svg" viewBox="0 0 ${width} 404" role="img" aria-label="${esc(currentCostYears+'-year estimated cash cost: '+DATA.cars.map(c=>c.short+' '+c[field]).join('; '))}"><title>${currentCostYears}-year cash cost, estimated</title>${DATA.cars.map((c,i)=>`<g><text x="0" y="${18+i*row}" fill="#c3d1e8" font-size="12">${esc(carLabel(c))}</text><text x="${width}" y="${18+i*row}" text-anchor="end" fill="#d9e7fb" font-size="12">${esc(c[field])}</text><rect x="0" y="${29+i*row}" width="${width}" height="11" rx="5" fill="#1a2a45"/><rect x="0" y="${29+i*row}" width="${c[num]/max*width}" height="11" rx="5" fill="#5AC8FA" opacity="${c.id===1?'.92':'.45'}"/></g>`).join('')}</svg>`;document.querySelectorAll('[data-years]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.years)===currentCostYears));}
function renderScores(){return section('scorecard','08','One decision. Transparent weights.','BE 6 is the primary pick. Harrier EV is the runner-up. Expand a car to inspect the trade-offs.',`<p class="section-lead">Scores are analyst estimates, not measured reliability statistics. Missing crash/warranty evidence lowers confidence; differences of a few hundredths are not meaningful.</p><div class="weights-bar reveal" role="img" aria-label="${esc(DATA.criteria.map(c=>c.label+' '+c.weight+'%').join(', '))}">${DATA.criteria.map((c,i)=>`<span style="flex:${c.weight};opacity:${.35+i*.07}" title="${esc(c.label)}: ${c.weight}%"></span>`).join('')}</div><div class="weights-legend">${DATA.criteria.map(c=>`<span>${esc(c.label)}<b>${c.weight}%</b></span>`).join('')}</div><div class="scores-list">${DATA.cars.map(c=>`<details class="score-item reveal"><summary><span class="score-name">${esc(carLabel(c))}<small>Rank ${c.rank}${c.id===1?' · Primary pick':c.id===6?' · Runner-up':''}</small></span><span class="score-track"><span class="score-fill" data-fill="${c.score}"></span></span><span class="score-total">${c.score}<small> /10</small></span><span class="expand-icon" aria-hidden="true">＋</span></summary><div class="criteria-list">${DATA.criteria.map((k,i)=>`<div class="criterion"><span>${esc(k.label)} · ${k.weight}%</span><strong>${c.scores[i].toFixed(1)} /10</strong></div>`).join('')}</div></details>`).join('')}</div>${notes('Scoring notes',DATA.notes.scores)}`,true);}

}else document.querySelectorAll('[data-fill]').forEach(b=>b.style.width=Number(b.dataset.fill)*10+'%');
